<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>Marker Image AR</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="overlay" aria-label="Marker AR status">
      <section class="panel">
        <p class="eyebrow">Marker-based AR</p>
        <h1>Point at a Hiro marker</h1>
        <p id="status-text">Starting camera. Show the Hiro marker to display the virtual image.</p>
        <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" rel="noreferrer">
          Open Hiro marker
        </a>
      </section>
    </main>

    <a-scene
      id="ar-scene"
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    >
      <a-assets>
        <img id="virtual-image" src="images/pin.jpeg" alt="Virtual AR image" />
      </a-assets>

      <a-marker id="hiro-marker" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="3">
        <a-entity id="virtual-content" position="0 0 0">
          <a-plane
            src="#virtual-image"
            width="1.6"
            height="1.6"
            position="0 0.05 0"
            rotation="-90 0 0"
            transparent="true"
          ></a-plane>
          <a-ring
            color="#69f0ae"
            radius-inner="0.75"
            radius-outer="0.9"
            position="0 0.025 0"
            rotation="-90 0 0"
            opacity="0.9"
          ></a-ring>
          <a-text
            value="Virtual marker found"
            align="center"
            color="#ffffff"
            width="3.6"
            position="0 1.05 0"
            rotation="-65 0 0"
          ></a-text>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
